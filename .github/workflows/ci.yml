name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test and build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install "pytest>=8,<9" build

    - name: Compile Python sources
      run: python -m compileall -q cli.py pathway_variance

    - name: Run Python tests
      run: python -m pytest -p no:zarr -v

    - name: Run CLI batch smoke test
      run: |
        python cli.py batch -i sample.csv -o out_smoke.csv
        test -f out_smoke.csv
        python -c "import csv; rows = list(csv.DictReader(open('out_smoke.csv', encoding='utf-8'))); assert len(rows) == 5"
        rm out_smoke.csv

    - name: Check browser application
      run: |
        node --check docs/engine.mjs
        node --check docs/app.mjs
        node tests/browser_smoke.mjs

    - name: Build wheel
      run: python -m build --wheel

    - name: Verify installed console scripts
      run: |
        python -m venv /tmp/cpv-wheel-test
        /tmp/cpv-wheel-test/bin/python -m pip install --upgrade pip
        /tmp/cpv-wheel-test/bin/python -m pip install dist/*.whl
        /tmp/cpv-wheel-test/bin/clinical-pathway-variance-agent --demo --json > /tmp/cpv-agent.json
        /tmp/cpv-wheel-test/bin/clinical-pathway-variance-engine --demo --json > /tmp/cpv-engine.json
        /tmp/cpv-wheel-test/bin/python -c "import json; assert json.load(open('/tmp/cpv-agent.json'))['patient_id'] == 'PT-COLORECTAL-101'"
        cmp /tmp/cpv-agent.json /tmp/cpv-engine.json
