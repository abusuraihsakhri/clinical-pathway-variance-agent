[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-pathway-variance-agent"
version = "2.0.1"
description = "ERAS pathway adherence and variance analysis tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
clinical-pathway-variance-engine = "cli:main"
clinical-pathway-variance-agent = "cli:main"

[project.urls]
Repository = "https://github.com/abusuraihsakhri/clinical-pathway-variance-agent"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["pathway_variance*"]
